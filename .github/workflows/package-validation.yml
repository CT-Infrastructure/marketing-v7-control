name: Package validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; verify before adoption
        with:
          persist-credentials: false
      - name: Validate package and build DAG
        run: python3 tools/validate_package.py
      - name: Test local tooling
        run: python3 -m unittest discover -s tests/package -v
  f07-harness-qualified-offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      F07_NATIVE_VARIANT: ubuntu-0.9.0-1ubuntu0.3-jammy-source-v1
      F07_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.3'
      - name: Qualify isolated synthetic harness
        run: bash .github/scripts/validate-f07-harness.sh run
      - name: Upload bounded synthetic evidence
        id: f07-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, node24
        with:
          name: f07-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.F07_ROOT }}/upload/evidence.json
            ${{ env.F07_ROOT }}/upload/manifest.json
          retention-days: 7
          archive: true
          if-no-files-found: error
          compression-level: 6
          overwrite: false
          include-hidden-files: false
      - name: Verify actual same-run service metadata
        env:
          GH_TOKEN: ${{ github.token }}
          F07_ARTIFACT_ID: ${{ steps.f07-upload.outputs.artifact-id }}
          F07_ARTIFACT_DIGEST: ${{ steps.f07-upload.outputs.artifact-digest }}
        run: bash .github/scripts/validate-f07-harness.sh metadata
      - name: Dispose owned scratch while runner survives
        if: always()
        run: bash .github/scripts/validate-f07-harness.sh cleanup
  f07-builder-public-inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      F07_TASK: F07
      F07_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inventory fixed public builder files without invoking tools
        run: python3 -I -B tests/harness/native_builder_inventory.py inventory "${{ runner.temp }}/f07-builder-inventory-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload bounded public inventory only
        id: f07-builder-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: f07-builder-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/f07-builder-inventory-${{ github.run_id }}-${{ github.run_attempt }}/inventory.json
            ${{ runner.temp }}/f07-builder-inventory-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json
          retention-days: 7
          archive: true
          if-no-files-found: error
          compression-level: 6
          overwrite: false
          include-hidden-files: false
      - name: Dispose only this inventory root while runner survives
        if: always()
        run: python3 -I -B tests/harness/native_builder_inventory.py cleanup "${{ runner.temp }}/f07-builder-inventory-${{ github.run_id }}-${{ github.run_attempt }}"
